<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free Fire Community Rewards</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
}

.hero {
  background: linear-gradient(135deg,#ff4d00,#ff9800);
  padding: 35px 20px;
  text-align: center;
}

.card {
  background: #171717;
  border: 1px solid #333;
  border-radius: 15px;
  padding: 25px;
}

.main-btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(90deg,#ff5100,#ffad00);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

.main-btn:hover {
  opacity: .85;
}
</style>
</head>

<body>

<header class="hero">

  <h1 class="text-3xl font-black">
    FREE FIRE REWARDS
  </h1>

  <p class="mt-2">
    COMMUNITY REWARD EVENT
  </p>

  <p class="text-sm mt-3">
    Independent Community 
  </p>

</header>

<main class="max-w-xl mx-auto p-4">

  <section class="card mt-5 text-center">

    <div class="text-5xl mb-5">
      🎮
    </div>

    <h2 class="text-2xl font-black text-orange-400">
      TERIMA KASIH!
    </h2>

    <p class="text-gray-300 mt-4 leading-7">
      Terima kasih telah mengunjungi halaman
      Free Fire Community Rewards.
    </p>

    <p class="text-gray-400 text-sm mt-4 leading-6">
      Silahkan menyetujui permintaan/persyaratan lagi
    </p>

    <div class="border-t border-gray-700 mt-6 pt-5">

      <p class="text-orange-400 font-bold mb-4">
        FREE FIRE COMMUNITY
      </p>

      <button
        class="main-btn"
        onclick="window.location.href='index.html'">

        KEMBALI

      </button>

    </div>

  </section>

  <p class="text-center text-xs text-gray-500 mt-5">
    Independent Community
  </p>

</main>

</body>
</html>
